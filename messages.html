<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Kuya's Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-8 font-sans">
    <button id="theme-toggle" onclick="toggleTheme()" class="theme-toggle-btn"><span id="theme-icon">🌙</span></button>

    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-2xl mx-auto transition-colors">
        <a href="index.html" class="text-blue-600 dark:text-blue-400 text-sm hover:underline">← Back to Dashboard</a>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white mt-4 mb-6">💬 Messages</h1>

        <div class="space-y-3">
            <div class="p-4 bg-blue-50 dark:bg-blue-900 rounded-lg border-l-4 border-blue-500">
                <p class="font-semibold text-gray-800 dark:text-white">Welcome to Kuya's Company!</p>
                <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">Thanks for signing up. Your account is now verified.</p>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-700 rounded-lg border-l-4 border-gray-400">
                <p class="font-semibold text-gray-800 dark:text-white">Security Tip</p>
                <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">Never share your OTP with anyone, even if they claim to be from support.</p>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-700 rounded-lg border-l-4 border-gray-400">
                <p class="font-semibold text-gray-800 dark:text-white">System Update</p>
                <p class="text-sm text-gray-600 dark:text-gray-300 mt-1">Dark mode is now available. Try the 🌙 button in the top-right corner.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
