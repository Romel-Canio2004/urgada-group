<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Kuya's Company</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-8 font-sans">
    <button id="theme-toggle" onclick="toggleTheme()" class="theme-toggle-btn"><span id="theme-icon">🌙</span></button>

    <div class="bg-white dark:bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-2xl mx-auto transition-colors">
        <a href="index.html" class="text-blue-600 dark:text-blue-400 text-sm hover:underline">← Back to Dashboard</a>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white mt-4 mb-6">⚙️ Settings</h1>

        <div class="space-y-4">
            <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <div>
                    <p class="font-semibold text-gray-800 dark:text-white">Dark Mode</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Switch between light and dark theme</p>
                </div>
                <button onclick="toggleTheme()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-sm">Toggle</button>
            </div>

            <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <div>
                    <p class="font-semibold text-gray-800 dark:text-white">Notifications</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Receive login alerts</p>
                </div>
                <input type="checkbox" checked class="w-5 h-5">
            </div>

            <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                <div>
                    <p class="font-semibold text-gray-800 dark:text-white">Two-Factor Auth</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Enabled via OTP</p>
                </div>
                <span class="text-green-600 dark:text-green-400 text-sm font-semibold">✓ Active</span>
            </div>
        </div>

        <button onclick="clearAccount()" class="w-full mt-6 p-3 bg-red-500 text-white rounded hover:bg-red-600 transition">
            🗑️ Delete Account
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
